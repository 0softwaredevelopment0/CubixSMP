plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.24'
    id 'com.gradleup.shadow' version '9.4.2'
}

group = 'com.cubixsmp'
// Workspace version scheme: version.subversion.patch-channel.number
// 2.0.0-alpha.1 — platform port to Minecraft/Paper 26.3 (new Paper plugin loader).
version = '2.0.0-alpha.1'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "placeholderapi-repo"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
    maven {
        name = "enginehub-repo"
        url = "https://maven.enginehub.org/repo/"
    }
}

dependencies {
    // Minecraft 26.3 dev-bundle (Mojang mappings) — нативный Dialog API
    paperweight.paperDevBundle("26.3.build.+")
    compileOnly("me.clip:placeholderapi:2.11.6")
    // WorldGuard 7.0.14 объявляет строгие версии gson/guava/fastutil (Mojang provides),
    // которые конфликтуют с версиями из dev-bundle 26.3 — исключаем их транзитивы
    // (compileOnly: в рантайме эти либы даёт сервер).
    compileOnly("com.sk89q.worldguard:worldguard-bukkit:7.0.14") {
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
    }
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(26))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Surface deprecated API usage (Bukkit legacy -> modern Paper rewrites).
    options.compilerArgs << '-Xlint:deprecation'
}

// Inject the Gradle version into the Paper plugin manifest so the jar version
// can never drift from project.version again (it used to be hardcoded).
processResources {
    filteringCharset = 'UTF-8'
    inputs.property('version', project.version)
    filesMatching(['paper-plugin.yml', 'plugin.yml']) {
        expand(project: project)
    }
}

shadowJar {
    archiveBaseName.set('CubixSMP')
    archiveClassifier.set('')
    archiveVersion.set(project.version)
}

// Built jar lives in build/libs/ — tracked by git for easy download.

tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
}

build.dependsOn shadowJar
