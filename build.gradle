plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
    id 'com.gradleup.shadow' version '9.4.2'
}

group = 'com.cubixsmp'
version = '1.2.4'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "placeholderapi-repo"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
    maven {
        name = "enginehub-repo"
        url = "https://maven.enginehub.org/repo/"
    }
}

dependencies {
    // Minecraft 26.2 dev-bundle (Mojang mappings) — нативный Dialog API
    paperweight.paperDevBundle("26.2.build.+")
    compileOnly("me.clip:placeholderapi:2.11.6")
    // WorldGuard 7.0.14 объявляет строгие версии gson/guava/fastutil (Mojang provides),
    // которые конфликтуют с версиями из dev-bundle 26.2 — исключаем их транзитивы
    // (compileOnly: в рантайме эти либы даёт сервер).
    compileOnly("com.sk89q.worldguard:worldguard-bukkit:7.0.14") {
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
    }
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(26))
}

shadowJar {
    archiveBaseName.set('CubixSMP')
    archiveClassifier.set('')
    archiveVersion.set(project.version)
}

// Built jar lives in build/libs/ — tracked by git for easy download.

tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
}

build.dependsOn shadowJar
