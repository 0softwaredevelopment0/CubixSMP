# ╔════════════════════════════════════════════════════════════════════╗
# ║                    CubixSMP Configuration                         ║
# ║                       Version 1.2                                 ║
# ╚════════════════════════════════════════════════════════════════════╝
#
# 🔗 Полное руководство: https://github.com/rizer001/CubixSMP
#
# ═════════════════════════════════════════════════════════════════════
# 📊 НАСТРОЙКИ СИСТЕМЫ УРОВНЕЙ
# ═════════════════════════════════════════════════════════════════════
# Настройки расположены сверху, сообщения — снизу (раздел "messages:").
# При изменении этого файла используйте /cubixsmp reload
# или перезагрузите сервер.

# ─────────────────────────────────────────────
# 📊 SYSTEM — Основные настройки системы уровней
# ─────────────────────────────────────────────
settings:
  # Формула XP на уровень: base + (level * multiplier)
  # Пример: уровень 0→1 = 100 XP, уровень 1→2 = 100 + 1*1.5 = 101.5 XP
  xp-base: 100
  xp-multiplier: 1.5
  min-level: 1
  max-level: 100
  # XP для первого левелапа (min-level → min-level+1). Отдельная настройка.
  min-level-xp: 100

  # 🚶 Настройки XP за дистанцию
  distance-interval: 1000     # блоков на один тик XP
  xp-per-distance-interval: 5 # XP за каждый интервал

  # 📢 Способ отправки XP-уведомлений: true = actionbar, false = чат
  use-actionbar: true

  # ⏱ Настройки XP за отыгранное время
  playtime-xp-enabled: true   # вкл/выкл выдачу XP за онлайн
  playtime-interval: 1800     # секунд на один тик XP (1800 = 30 мин)
  xp-per-playtime-interval: 10

  # ☀ Ежедневный бонус
  # Выдаётся автоматически при ПЕРВОМ входе игрока за день (команды /cubixsmp daily больше нет)
  daily-bonus-xp: 50          # XP за ежедневный бонус

  # 👑 Топ игроков
  leaders-limit: 10           # сколько игроков показывать в /cubixsmp leaders

  # 📖 Помощь /csmp help
  help-page-size: 6           # команд на страницу в /csmp help

# ═════════════════════════════════════════════════════════════════════
# ⛏ 1. MINING — Опыт за добычу руд
# ═════════════════════════════════════════════════════════════════════
# Опыт начисляется только за натурально заспавненные руды.
# Проверка: блок окружён натуральным камнем (stone, deepslate, netherrack и т.д.)
mining:
  enabled: true
  # Опыт НЕ начисляется, если руда добыта инструментом с шёлковым касанием.
  # Защита от абуза: собрать руду шёлком → поставить → сломать → фарм опыта.
  silk-touch-no-xp: true
  # Древние обломки (ANCIENT_DEBRIS) ВСЕГДА выпадают незеритовым скрапом (1 шт.),
  # а не блоком. В ваниле обломки падают блоком даже без шёлка — их можно собрать,
  # поставить и сломать снова для фарма опыта. С крапом блок собрать невозможно.
  debris-always-scrap: true
  blocks:
    # Уголь
    COAL_ORE: 1.0
    DEEPSLATE_COAL_ORE: 1.0
    # Медь
    COPPER_ORE: 2.0
    DEEPSLATE_COPPER_ORE: 2.0
    # Железо
    IRON_ORE: 3.0
    DEEPSLATE_IRON_ORE: 3.0
    # Кварц (Nether)
    NETHER_QUARTZ_ORE: 3.0
    # Золото
    GOLD_ORE: 4.0
    DEEPSLATE_GOLD_ORE: 4.0
    # Лазурит
    LAPIS_ORE: 4.0
    DEEPSLATE_LAPIS_ORE: 4.0
    # Редстоун
    REDSTONE_ORE: 4.0
    DEEPSLATE_REDSTONE_ORE: 4.0
    # Алмазы
    DIAMOND_ORE: 5.0
    DEEPSLATE_DIAMOND_ORE: 5.0
    # Древние обломки
    ANCIENT_DEBRIS: 10.0

    # ✨ Дополнительные руды (можно добавить свои)
    # NETHER_GOLD_ORE: 2.0
    # EMERALD_ORE: 6.0
    # DEEPSLATE_EMERALD_ORE: 6.0

# ═════════════════════════════════════════════════════════════════════
# 🌾 2. FARMING — Опыт за фермерство
# ═════════════════════════════════════════════════════════════════════
# Опыт даётся только за полностью созревшие культуры.
# Для тыквы/арбуза — за сломанный блок.
farming:
  enabled: true
  # 🚫 Отключить вытаптывание грядок (игроки и мобы не превращают FARMLAND в DIRT)
  no-trampling: true
  crops:
    # Культуры (только созревшие, age = max)
    WHEAT: 0.5
    CARROTS: 0.5
    POTATOES: 0.5
    # Блоки (без age)
    PUMPKIN: 1.0
    MELON: 1.0
    # Ягоды (age >= 2)
    SWEET_BERRY_BUSH: 0.5
    # Мёд (через BlockDropItemEvent)
  honey:
    HONEY_BOTTLE: 5.0
    HONEYCOMB: 2.0

# ═════════════════════════════════════════════════════════════════════
# 🌲 3. WOODCUTTING — Опыт за рубку деревьев
# ═════════════════════════════════════════════════════════════════════
# Опыт начисляется только за деревья, выросшие натурально
# (проверка: под бревном натуральная земля/камень, рядом листва)
woodcutting:
  enabled: true
  # 🪓 Топор не теряет прочность при ломании листвы (удобно при рубке деревьев)
  axe-no-durability-loss: true
  logs:
    # Переопределённые дубы
    OAK_LOG: 0.2
    DARK_OAK_LOG: 0.2
    # Ель
    SPRUCE_LOG: 0.2
    # Берёза
    BIRCH_LOG: 0.2
    # Тропическое дерево
    JUNGLE_LOG: 0.2
    # Акация
    ACACIA_LOG: 0.2
    # Мангровое дерево
    MANGROVE_LOG: 0.2
    # Вишня
    CHERRY_LOG: 0.2
    # Бледный дуб
    PALE_OAK_LOG: 0.2
    # Адские стебли
    CRIMSON_STEM: 0.2
    WARPED_STEM: 0.2

# ═════════════════════════════════════════════════════════════════════
# 🎣 4. FISHING — Опыт за рыбалку
# ═════════════════════════════════════════════════════════════════════
# Начисляется за каждую пойманную рыбу (COD, SALMON, PUFFERFISH, TROPICAL_FISH)
fishing:
  enabled: true
  xp-per-catch: 5.0

# ═════════════════════════════════════════════════════════════════════
# ⚔ 5. HUNTING — Опыт за охоту на мобов
# ═════════════════════════════════════════════════════════════════════
# Опыт начисляется только за натурально заспавненных мобов
# (не из спавнера, не из яйца призыва, не через команду)
# Используется Paper API + fallback на проверку спавнеров рядом
hunting:
  enabled: true
  mobs:
    # Враждебные мобы
    ZOMBIE: 3.0
    SKELETON: 3.0
    SPIDER: 3.0
    CREEPER: 4.0
    ENDERMAN: 5.0
    WITCH: 5.0
    BLAZE: 6.0
    # Адские мобы
    HOGLIN: 4.0
    PIGLIN: 3.0
    ZOMBIFIED_PIGLIN: 3.0
    PIGLIN_BRUTE: 5.0
    ZOGLIN: 4.0
    GHAST: 5.0
    # Пещерные
    CAVE_SPIDER: 3.0
    SILVERFISH: 1.0
    SLIME: 2.0
    MAGMA_CUBE: 2.0
    # Особые
    PHANTOM: 4.0
    WARDEN: 50.0
    ELDER_GUARDIAN: 20.0
    WITHER_SKELETON: 5.0
    DROWNED: 3.0
    HUSK: 3.0
    STRAY: 3.0
    BOGGED: 3.0
    BREEZE: 6.0
    CREAKING: 5.0
    # Разбойники
    PILLAGER: 3.0
    VINDICATOR: 4.0
    EVOKER: 8.0
    RAVAGER: 10.0

    # ✨ Можно добавить любых других мобов:
    # WITHER: 100.0
    # ENDER_DRAGON: 200.0
    # ALLAY: 1.0
    # FROG: 1.0
    # GOAT: 2.0

# ═════════════════════════════════════════════════════════════════════
# 📢 6. CHAT PING — @пнг в чате
# ═════════════════════════════════════════════════════════════════════
# Позволяет пинговать игроков через @ник, @everyone, @admins в чате.
# Пингуемый текст выделяется жирным + подчёркнутым.
# Пингуемые игроки слышат звуковой сигнал (можно отключить через /csmp ping).
chat-ping:
  enabled: true
  # Формат пинга (MiniMessage). <mention> заменяется на имя игрока.
  # Примеры: <bold><underlined>@<mention></underlined></bold>
  #          <rainbow>@<mention></rainbow>
  #          <gradient:#FFD700:#FFA500>@<mention></gradient>
  mention-format: "<bold><underlined>@<mention></underlined></bold>"
  # Звук пинга (название из Minecraft: ENTITY_EXPERIENCE_ORB_PICKUP, BLOCK_NOTE_BLOCK_PLING и т.д.)
  ping-sound: "BLOCK_NOTE_BLOCK_PLING"
  # Громкость звука пинга (0.0 - 2.0)
  ping-sound-volume: 0.8
  # Высота звука пинга (0.5 - 2.0)
  ping-sound-pitch: 1.5
  # Типы пингов
  ping-types:
    # @everyone — пинг всех онлайн-игроков
    everyone:
      enabled: true
      # Право для использования @everyone (по умолчанию у всех)
      permission: "cubixsmp.ping.everyone"
    # @admins / @admin / @ops — пинг администрации
    admins:
      enabled: true
      # Право для использования @admins
      permission: "cubixsmp.ping.admins"
      # Кто считается админом (цель для пинга). Игроки с этим правом будут слышать @admins
      target-permission: "cubixsmp.ping.admins-target"

# ═════════════════════════════════════════════════════════════════════
# 🔄 7. CHAT PLACEHOLDERS — Плейсхолдеры в чате (значение отправителя)
# ═════════════════════════════════════════════════════════════════════
# Когда игрок пишет в чат сообщение с %cubixsmp_...% — все получатели видят
# значение ОТПРАВИТЕЛЯ (одинаковое для всех).
# Пример: "Мой ур. %cubixsmp_level%" → все увидят уровень автора сообщения.
chat-placeholders:
  enabled: true

# ═════════════════════════════════════════════════════════════════════
# 📊 8. PLAYTIME TRACKER — Ежедневный онлайн игроков
# ═════════════════════════════════════════════════════════════════════
# Трекинг времени входа/выхода с разбивкой по дням.
# Логи хранятся N дней, после чего автоматически очищаются.
# Команда: /checkonline [ник]
playtime-tracker:
  enabled: true
  # Сколько дней хранить логи (старые автоматически удаляются)
  log-retention-days: 7
  # Интервал автосохранения в минутах
  auto-save-interval: 5
  # Интервал автоочистки в минутах
  auto-cleanup-interval: 60

# ═════════════════════════════════════════════════════════════════════
# ⚒ 9. ANVIL — Запрет зачарований выше ванильного лимита
# ═════════════════════════════════════════════════════════════════════
# Запрещает получать зачарования выше ванильного максимума при объединении
# предметов в наковальне (например, две книги «Эффективность V» не дадут
# «Эффективность VI» — такие зачарования можно получить только за донат-валюту).
anvil:
  enabled: true

# ═════════════════════════════════════════════════════════════════════
# ⚡ 9.5. CUSTOM ENCHANTS — «Бур» и «Автопереплавка»
# ═════════════════════════════════════════════════════════════════════
# Спец. зачарования на PDC (НЕ ванильные): инструмент помечается меткой,
# а название чара добавляется в описание (лор) предмета.
#   • Книга выдаётся командой: /csmp admin giveenchant <игрок> <bur|autosmelt>
#   • Применение на верстаке: инструмент + спец. книга = инструмент с чаром
#     (крафт делает сам плагин, ванильного рецепта нет).
custom-enchants:
  enabled: true

  # ─── «Бур» — копает область 3×3 в плоскости взгляда ───
  # Смотрит вниз/вверх — ломается горизонтальная плоскость,
  # влево/вправо/прямо — вертикальная.
  bur:
    enabled: true
    # Название чара (добавляется в описание предмета)
    name: "Бур"
    # Строка в описании инструмента (название чара)
    lore-line: "§dБур"
    # Описание (для лора книги)
    description: "Копает область 3×3 в плоскости взгляда (вниз/вверх/влево/вправо/прямо)"
    # Не ломать блоки, поставленные игроками (защита построек).
    # ВНИМАНИЕ: трекер помнит только руды/брёвна/культуры — обычные стройблоки
    # (камень, булыжник и т.п.) защищают плагины привата: для области бур
    # шлёт синтетические BlockBreakEvent, которые видят WorldGuard и другие.
    respect-placed-blocks: true
    # Тратить прочность инструмента за каждый блок области (в дополнение к центральному)
    consume-durability: true
    # Звук при срабатывании
    play-sound: true

  # ─── «Автопереплавка» — руда выпадает слитками ───
  # Железная, медная, золотая руда (и их глубокосланцевые варианты)
  # и древние обломки выпадают сразу переплавленными.
  autosmelt:
    enabled: true
    name: "Автопереплавка"
    lore-line: "§dАвтопереплавка"
    description: "Железная, медная, золотая руда и древние обломки выпадают переплавленными"

  # ─── Спец. книга (выдаётся командой) ───
  book:
    name: "§d§lЗачарованная книга"
    # {enchant} — название зачарования, {description} — описание чара
    lore:
      - "§7Содержит зачарование: §f{enchant}"
      - "§7{description}"
      - "§7Примените на верстаке: инструмент + эта книга"

# ═════════════════════════════════════════════════════════════════════
# 📍 10. REGION CHAT — сообщения о входе/выходе из региона WorldGuard
# ═════════════════════════════════════════════════════════════════════
# При входе игрока в регион WorldGuard в ЧАТ отправляется сообщение
# «Вы вошли в регион <название>», при выходе — «Вы покидаете регион <название>».
# Сообщение отправляется ровно ОДИН раз на каждое изменение региона — без спама
# (в отличие от старого ActionBar, чат не гаснет, поэтому таймер не нужен).
# Требуется установленный WorldGuard.
region-chat:
  enabled: true
  # {region} — название региона. Синтаксис MiniMessage (или legacy §).
  enter-message: "<white>Вы вошли в регион <yellow>{region}</yellow></white>"
  exit-message: "<white>Вы покидаете регион <yellow>{region}</yellow></white>"

# ═════════════════════════════════════════════════════════════════════
# 💬 11. CHAT FORMAT — полная настройка чата
# ═════════════════════════════════════════════════════════════════════
# Единый обработчик чата:
# 1. Формат ВСЕЙ строки чата задаётся в chat-format.format (MiniMessage).
#    Внутренние плейсхолдеры:
#      {player}   — ник отправителя (при наведении — тултип)
#      {message}  — сообщение игрока
#    В формате можно использовать ЛЮБЫЕ %плейсхолдеры% PlaceholderAPI
#    (например %vault_prefix%, %cubixsmp_level%) — их значение принадлежит
#    ОТПРАВИТЕЛЮ и одинаково для всех получателей.
#    Формат принимает: MiniMessage (<aqua>, <gradient:#FFD700:#FFA500>),
#    legacy (§a, &a) и их смесь в одной строке.
# 2. miniMessage в самом СООБЩЕНИИ — игроки с правом chat-format.permission
#    могут использовать теги форматирования: <red>, <bold>,
#    <gradient:#FFD700:#FFA500>, <rainbow> и т.д. Без права теги
#    показываются как обычный текст.
# 3. [item_hand] — вместо текста показывается название предмета в руке,
#    при наведении — тултип с зачарованиями и лором (как в инвентаре).
# 4. Клик ТОЛЬКО по нику отправителя открывает НАТИВНОЕ диалоговое окно
#    (Minecraft 26.2 Dialog API) «Что вы хотите сделать?» с кнопками
#    [ЛС] (/m), [TPA] (/tpa) и [Отмена]. Кнопка [ЛС] открывает второе окно
#    с полем ввода текста сообщения, [TPA] выполняется сразу.
#    Окна используют DialogAction.CLOSE: клиент закрывает диалог СРАЗУ после
#    клика (без экрана «Waiting for server…»), а сервер выполняет действие.
#    Анти-спам: КД между открытиями — chat-format.click-menu-cooldown.
# 5. %плейсхолдеры% в сообщении и в формате подставляются со значением
#    ОТПРАВИТЕЛЯ — все видят одно и то же.
# 6. При внутренней ошибке отправки сообщения игрок получает настраиваемое
#    сообщение chat-format.send-error-message (MiniMessage).
chat-format:
  enabled: true
  # Формат чата. Синтаксис MiniMessage, доступны {player} и {message},
  # а также любые %плейсхолдеры% PlaceholderAPI.
  # Примеры:
  #   "<dark_gray>[</dark_gray><aqua>{player}</aqua><dark_gray>]</dark_gray> <white>{message}</white>"
  #   "<gradient:#55FF55:#00AAAA>{player}</gradient> <gray>»</gray> <white>{message}</white>"
  #   "%vault_prefix% {player} <gray>»</gray> {message}"
  #   "&7[&b{player}&7] &f{message}"
  format: "<dark_gray>[</dark_gray><aqua>{player}</aqua><dark_gray>]</dark_gray> <white>{message}</white>"
  # Право на miniMessage форматирование в чате (цвета, градиенты, жирный и т.д.)
  permission: "cubixsmp.chat.format"
  # Тултип при наведении на ник
  nickname-hover: "§7Клик — действия с игроком"
  # Нативное диалоговое окно при клике по нику отправителя в чате
  click-menu-enabled: true
  # Анти-спам: КД между открытиями диалога в миллисекундах (1000 = 1 сек)
  click-menu-cooldown: 1000
  # Кнопка [ЛС]: после ввода текста выполняется msg-command + текст сообщения
  msg-command: "/m {player}"
  # Кнопка [TPA]: команда выполняется сразу при клике
  tpa-command: "/tpa {player}"
  # Что показывается вместо [item_hand], если рука пустая
  item-empty: "§7пустая рука"
  # Сообщение при внутренней ошибке отправки сообщения в чат (MiniMessage)
  send-error-message: "<red>Не удалось отправить сообщение в чат из-за внутренней ошибки сервера, попробуйте позже.</red>"

  # ─── Тексты диалогового окна (MiniMessage) ─────────────────────
  # {player} — ник игрока, над которым открыто окно
  action-dialog:
    # Окно «Что вы хотите сделать?»
    title: "<gold>✦ Что вы хотите сделать?</gold>"
    body: "<white>Действия с игроком </white><yellow>{player}</yellow><white>:</white>"
    msg-button: "<green>✉ Личное сообщение</green>"
    tpa-button: "<aqua>⛏ Телепортация</aqua>"
    cancel-button: "<red>✖ Отмена</red>"
    # Окно ввода текста для /m
    msg-title: "<gold>✉ Сообщение для </gold><yellow>{player}</yellow>"
    msg-body: "<white>Введите текст сообщения для </white><yellow>{player}</yellow><white>:</white>"
    msg-input-label: "<gray>Текст сообщения</gray>"
    msg-send-button: "<green>✔ Отправить</green>"
    msg-cancel-button: "<red>✖ Отмена</red>"

# ═════════════════════════════════════════════════════════════════════
# 💀 12. DEATH MESSAGE — координаты смерти в чат
# ═════════════════════════════════════════════════════════════════════
# После смерти игроку в чат автоматически отправляется настраиваемое
# сообщение с координатами места смерти.
# Сообщение получают ТОЛЬКО игроки с правом из настройки permission
# (по умолчанию cubixsmp.deathmessage).
# Текст сообщения — messages.death.death_coords (плейсхолдеры {x} {y} {z} {world}).
death-message:
  enabled: true
  # Право, необходимое для получения сообщения о смерти
  permission: "cubixsmp.deathmessage"

# ═════════════════════════════════════════════════════════════════════
# 📻 13. CHAT CHANNELS — каналы чата
# ═════════════════════════════════════════════════════════════════════
# Четыре канала: локальный [L], глобальный [G], мировой [W], админский [A].
# Канал выбирается префиксом в НАЧАЛЕ сообщения (message-prefix):
#   локальный — сообщение без префикса (дефолтный канал)
#   глобальный — сообщение с "!"   (видят все игроки сервера)
#   мировой    — сообщение с "$"   (видят только игроки в том же мире)
#   админский  — сообщение с "#"   (видят только игроки с правом канала)
# Локальный канал виден только игрокам в радиусе local-range блоков.
# Для отправки в канал нужно право permission (дефолты объявлены в plugin.yml:
# local/global/world — у всех, admin — только у OP). Без права — сообщение
# no-permission-message. Префиксы каналов и сообщения — MiniMessage.
# ВАЖНО: каналы работают при chat-format.enabled: true (единый обработчик чата).
chat-channels:
  enabled: true
  # Радиус действия локального чата (в блоках)
  local-range: 100
  # Сообщение при отсутствии права на отправку в канал (MiniMessage)
  no-permission-message: "<red>У вас нет прав чтобы отправлять сообщение в данный канал, попробуйте позже.</red>"
  channels:
    # ─── Локальный канал (дефолтный, без префикса в сообщении) ───
    local:
      # Префикс канала в чате (MiniMessage).
      # Примеры: "[L]", "<dark_gray>[</dark_gray><green>L</green><dark_gray>]</dark_gray>"
      prefix: "[L]"
      # Префикс сообщения для переключения на канал (пусто = канал по умолчанию)
      message-prefix: ""
      # Право на отправку сообщений в канал
      permission: "cubixsmp.chat.channel.local"
    # ─── Глобальный канал (видят все игроки сервера) ───
    global:
      prefix: "[G]"
      message-prefix: "!"
      permission: "cubixsmp.chat.channel.global"
    # ─── Мировой канал (видят только игроки в том же мире) ───
    world:
      prefix: "[W]"
      message-prefix: "$"
      permission: "cubixsmp.chat.channel.world"
    # ─── Админский канал (видят только игроки с правом) ───
    admin:
      prefix: "[A]"
      message-prefix: "#"
      permission: "cubixsmp.chat.channel.admin"

# ═════════════════════════════════════════════════════════════════════
# ✨ 14. PARTICLE TRAILS — партиклы вокруг игрока
# ═════════════════════════════════════════════════════════════════════
# Игрок включает персональный трейл частиц командой:
#   /csmp particle <имя>  — включить (например: note, rain, end_rod, flame, heart)
#   /csmp particle off    — выключить
#   /csmp particle list   — показать доступные частицы
# Имя частицы можно писать как Bukkit-имя (note), так и полный ключ (minecraft:note).
# В этом разделе настраивается, какие частицы разрешены и как они выглядят.
particles:
  enabled: true
  # Интервал спавна частиц в тиках (20 тиков = 1 секунда)
  interval-ticks: 4
  # Настройки по умолчанию (для частиц, не описанных в per-particle)
  count: 1
  offset-x: 0.4
  offset-y: 0.1
  offset-z: 0.4
  extra: 0.0
  # Частицы, доступные игрокам через /csmp particle <имя>.
  # Пустой список = разрешены ВСЕ простые частицы Bukkit (не требующие данных).
  # Право cubixsmp.particle.any позволяет использовать частицы вне этого списка.
  allowed:
    - "note"
    - "rain"
    - "end_rod"
    - "heart"
    - "flame"
  # Индивидуальные настройки частиц (необязательно).
  # name — имя частицы, остальные поля опциональны (берутся из верха секции).
  per-particle:
    - name: "note"
      count: 1
      offset-x: 0.4
      offset-y: 0.1
      offset-z: 0.4
      extra: 0
    - name: "rain"
      count: 20
      offset-x: 0.5
      offset-y: 1.0
      offset-z: 0.5
      extra: 0
# ═════════════════════════════════════════════════════════════════
# 🌍 15. WORLDS — пер-мировые настройки
# ═════════════════════════════════════════════════════════════════
# Настройки для отдельных миров. Ключ — ИМЯ МИРА (как у папки мира:
# world, world_nether, world_the_end, resource_world и т.д.).
# Миры, которых нет в списке, работают по глобальным настройкам.
# После изменения выполните /cubixsmp reload.
worlds:
  world:
    # 🚫 НЕ начислять Cubix-XP за активность в этом мире:
    # добыча руд, фермерство, рубка, рыбалка, охота, дистанция, онлайн (playtime).
    # Ежедневный бонус при входе и админ-команды (addxp/removexp и т.д.) работают как обычно.
    # Для мира Ада/Энда/ресурсного мира добавьте аналогичную секцию ниже.
    xp-disabled: false
    # 🚫 Запретить вытаптывание грядок ИМЕННО в этом мире:
    #   true  — запретить (даже если глобально farming.no-trampling: false)
    #   false — разрешить (даже если глобально farming.no-trampling: true)
    #   ключ не указан — берётся глобальная настройка farming.no-trampling
    # no-trampling: true
    # 💬 Отключить чат CubixSMP в этом мире: сообщения игроков этого мира
    # не отправляются (событие чата гасится). Только когда чатом управляет
    # CubixSMP (chat-format.enabled: true); fallback-путь тоже поддерживается.
    # chat-disabled: true
    # 💬 Свой ФОРМАТ чата для сообщений из этого мира — например, без клана
    # и привилегии (в основном формате эти данные приходят через
    # %плейсхолдеры% PlaceholderAPI — просто не включайте их сюда).
    # Синтаксис тот же, что у chat-format.format: MiniMessage, {player}, {message},
    # любые %плейсхолдеры% (значения отправителя). Каналы [L]/[G]/[W]/[A],
    # [item_hand] и клик по нику работают как обычно.
    # chat-format: "<dark_gray>[</dark_gray><aqua>{player}</aqua><dark_gray>]</dark_gray> <white>{message}</white>"

  # Примеры (раскомментируйте и поменяйте на свои миры):
  # resource_world:
  #   xp-disabled: true          # в ресурсном мире опыт Cubix не фармят
  #   no-trampling: false        # грядки можно топтать
  #   chat-disabled: false
  # world_nether:
  #   xp-disabled: false
  #   chat-format: "<gray>{player} <dark_gray>» <white>{message}</white>"  # без клана/привилегии

# ═════════════════════════════════════════════════════════════════
# 💬 СООБЩЕНИЯ ПЛАГИНА (переводимые)
# ═════════════════════════════════════════════════════════════════════
# Все сообщения, которые плагин отправляет игрокам.
# Вы можете переводить и изменять их без перекомпиляции JAR.
#
# После изменения выполните /cubixsmp reload.
#
# Цветовые коды:
#   §0-§f — стандартные Minecraft цвета
#   §l — жирный   §n — подчёркнутый   §o — курсив   §m — зачёркнутый
#
# Плейсхолдеры (заменяются автоматически):
#   {player}  — имя игрока
#   {level}   — уровень
#   {xp}      — количество опыта
#   {needed}  — XP до следующего уровня
#   {max}     — максимальный уровень
#   {amount}  — количество (XP, блоков, минут и т.д.)
#   {action}  — название действия (шахтёрство, фермерство и т.д.)
#   {target}  — целевой игрок (для админ-команд)
messages:
  # ─── Общие сообщения ─────────────────────────
  general:
    player_only: "§c❌ Только игрок может использовать эту команду!"
    no_permission: "§c❌ У вас нет прав на это действие!"
    player_not_found: "§c❌ Игрок §e{player} §cне найден!"
    config_reloaded: "§a✔ Конфигурация CubixSMP перезагружена!"
    console_not_allowed: "§c❌ Эту команду нельзя выполнять из консоли без указания игрока!"

  # ─── XP Уведомления ──────────────────────────
  xp:
    mining: "§7⛏ §a+{amount} XP §7(Шахтёрство)"
    farming: "§7🌾 §a+{amount} XP §7({action})"
    woodcutting: "§7🌲 §a+{amount} XP §7(Рубка деревьев)"
    fishing: "§7🎣 §a+{amount} XP §7(Рыбалка)"
    hunting: "§7⚔ §a+{amount} XP §7({action})"
    distance: "§7🚶 §a+{amount} XP §7(Пройдено {blocks} блоков)"
    playtime: "§7⏱ §a+{amount} XP §7за игру ({minutes} мин)"
    daily_bonus_claim: "§6☀ §eЕжедневный бонус: §a+{amount} XP"
    level_up: "§a✦ §eLevel Up! §7Теперь ты §e{level} §7уровня! §a✦"

  # ─── Названия действий (для xp.farming и xp.hunting) ──
  names:
    wheats: "Пшеница"
    carrots: "Морковь"
    potatoes: "Картошка"
    pumpkin: "Тыква"
    melon: "Арбуз"
    berry: "Ягоды"
    honey_bottle: "Мёд"
    honeycomb: "Соты"

  # ─── Команда /cubixsmp (help с пагинацией) ───
