    help_header: "§6CubixSMP §7v{version} §8— Помощь"
    help_empty: "§7Команды пока не настроены."
    help_page_label: "§8Страница §e{page}§7/§e{max}"
    help_prev_button: "§8[<]"
    help_prev_button_active: "§a[<]"
    help_prev_hover: "§7Предыдущая страница"
    help_next_button: "§8[>]"
