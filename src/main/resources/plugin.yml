name: CubixSMP
version: '1.0.0'
main: com.cubixsmp.CubixSMP
api-version: '26.2'
description: Level system for Cubix server
author: rizer001

softdepend:
  - PlaceholderAPI
  - WorldGuard

commands:
  cubixsmp:
    description: Main CubixSMP command
    aliases: [cs, cubix, csmp]
    permission: cubixsmp.user

permissions:
  cubixsmp.user:
    default: true
    description: "Базовые команды: /cubixsmp, /cubixsmp stats"

  cubixsmp.checkonline:
    default: true
    description: "Просмотр своего онлайна (/checkonline)"

  cubixsmp.checkonline.other:
    default: op
    description: "Просмотр онлайна других игроков (/checkonline <ник>)"

  cubixsmp.chat.format:
    default: false
    description: "Право на miniMessage форматирование в чате (цвета, градиенты, жирный и т.д.)"

  cubixsmp.chat.channel.local:
    default: true
    description: "Отправка сообщений в локальный канал чата [L]"

  cubixsmp.chat.channel.global:
    default: true
    description: "Отправка сообщений в глобальный канал чата [G]"

  cubixsmp.chat.channel.world:
    default: true
    description: "Отправка сообщений в мировой канал чата [W]"

  cubixsmp.chat.channel.admin:
    default: op
    description: "Отправка и просмотр админского канала чата [A]"

  cubixsmp.reload:
    default: op
    description: "Перезагрузка конфига (/cubixsmp reload)"

  cubixsmp.deathmessage:
    default: false
    description: "Сообщение с координатами смерти в чат (выдаётся отдельно)"

  cubixsmp.admin:
    default: op
    description: "Доступ ко всем админ-командам"

  cubixsmp.admin.setlevel:
    default: op
    description: "Установить уровень игроку (/cubixsmp admin setlevel <player> <level>)"

  cubixsmp.admin.addxp:
    default: op
    description: "Добавить XP игроку (/cubixsmp admin addxp <player> <amount>)"

  cubixsmp.admin.removexp:
    default: op
    description: "Забрать XP у игрока (/cubixsmp admin removexp <player> <amount>)"

  cubixsmp.admin.reset:
    default: op
    description: "Сбросить прогресс игрока (/cubixsmp admin reset <player>)"

  cubixsmp.admin.info:
    default: op
    description: "Показать информацию о игроке (/cubixsmp admin info <player>)"

  cubixsmp.admin.giveenchant:
    default: op
    description: "Выдать спец. зачарованную книгу (/cubixsmp admin giveenchant <player> <bur|autosmelt>)"

  cubixsmp.particle:
    default: true
    description: "Партикл-трейлы вокруг игрока (/csmp particle <имя>, off — выключить)"

  cubixsmp.particle.any:
    default: op
    description: "Использовать частицы вне списка particles.allowed в конфиге"